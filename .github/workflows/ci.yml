name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libmosquitto-dev \
            nlohmann-json3-dev libyaml-cpp-dev libgtest-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          find core backends apps platform tests integrations -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run -Werror

  z2s-sh:
    name: z2s.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck docker/z2s.sh tools/package_docker.sh tests/z2s_sh_test.sh
      - run: tests/z2s_sh_test.sh
