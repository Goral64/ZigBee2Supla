# zigbee2mqtt and Mosquitto next to zigbee2supla, for an own ZigBee coordinator
# without Home Assistant. Works with docker/standalone and docker/supla-docker.
#
# Installation (details: docs/docker.md):
#   1. copy this file and docker-compose.zigbee2mqtt-usb.yml (USB coordinator)
#      or docker-compose.zigbee2mqtt-network.yml (network coordinator) next to
#      the zigbee2supla compose file,
#   2. in .env of that directory (create it for standalone) set the
#      coordinator and the compose files, e.g. for USB:
#        ZIGBEE_ADAPTER=/dev/serial/by-id/usb-...
#        COMPOSE_FILE=docker-compose.yml:docker-compose.zigbee2mqtt.yml:docker-compose.zigbee2mqtt-usb.yml
#      or for a network coordinator:
#        ZIGBEE2MQTT_SERIAL_PORT=tcp://192.168.1.50:6638
#        ZIGBEE2MQTT_SERIAL_ADAPTER=zstack
#        COMPOSE_FILE=docker-compose.yml:docker-compose.zigbee2mqtt.yml:docker-compose.zigbee2mqtt-network.yml
#      (supla-docker: append the files to its COMPOSE_FILE),
#   3. docker compose up -d, open http://<host>:8080 and pick the coordinator.
services:
  zigbee2supla:
    environment:
      Z2S_MQTT_HOST: mosquitto
      Z2S_MQTT_PORT: "1883"
    depends_on:
      - mosquitto

  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    restart: unless-stopped
    # Anonymous access, reachable only inside this compose network.
    command: mosquitto -c /mosquitto-no-auth.conf
    logging:
      driver: "json-file"
      options:
        max-size: 10m

  zigbee2mqtt:
    image: ${ZIGBEE2MQTT_IMAGE:-ghcr.io/koenkk/zigbee2mqtt:latest}
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      # Web interface: first start setup, pairing, device list.
      - "${ZIGBEE2MQTT_PORT:-8080}:8080"
    volumes:
      # Network key and paired devices. Back it up!
      - ${ZIGBEE2MQTT_DATA:-./zigbee2mqtt}:/app/data
      - /run/udev:/run/udev:ro
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      # USB coordinator from docker-compose.zigbee2mqtt-usb.yml;
      # docker-compose.zigbee2mqtt-network.yml replaces it.
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/zigbee
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
      # zigbee2supla shows devices unavailable in ZigBee as offline in Supla.
      ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
    logging:
      driver: "json-file"
      options:
        max-size: 50m
